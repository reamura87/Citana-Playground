name: Jaga Supabase tetap aktif
on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 30 "${{ secrets.SUPABASE_URL }}/rest/v1/satua?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" > /dev/null
